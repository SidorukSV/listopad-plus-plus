name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.1 (the v-tag is created if missing)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64
    runs-on: windows-2022
    environment: production
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim()
            if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          } else {
            $version = '${{ github.ref_name }}'.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must have the form MAJOR.MINOR.PATCH; got '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Create a missing tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin main --tags --force
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Manual releases must point to a commit contained in main.'
          }
          $existing = git rev-list -n 1 $env:RELEASE_TAG 2>$null
          if ($existing -and $existing -ne $env:GITHUB_SHA) {
            throw "Tag $env:RELEASE_TAG already points to another commit."
          }
          if (-not $existing) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $env:RELEASE_TAG $env:GITHUB_SHA -m "Listopad++ $env:RELEASE_TAG"
            git push origin "refs/tags/$env:RELEASE_TAG"
          }

      - name: Install build and packaging tools
        run: |
          choco install ninja --no-progress -y
          dotnet tool install --global wix

      - name: Build and test Release
        run: >-
          ./scripts/build.ps1 -Preset release
          -Version '${{ steps.release.outputs.version }}'
          -Publisher '${{ vars.LISTOPAD_PUBLISHER || 'CN=ListopadPP Development' }}'

      - name: Decode signing certificate
        if: ${{ env.PFX_BASE64 != '' }}
        env:
          PFX_BASE64: ${{ secrets.LISTOPAD_PFX_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force .deps/signing | Out-Null
          [IO.File]::WriteAllBytes(
            '.deps/signing/release.pfx',
            [Convert]::FromBase64String($env:PFX_BASE64))

      - name: Package
        env:
          PFX_BASE64: ${{ secrets.LISTOPAD_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.LISTOPAD_PFX_PASSWORD }}
        run: |
          $arguments = @{
            SkipBuild = $true
            Version = '${{ steps.release.outputs.version }}'
            Publisher = '${{ vars.LISTOPAD_PUBLISHER || 'CN=ListopadPP Development' }}'
          }
          if ($env:PFX_BASE64) {
            $arguments.PfxPath = '.deps/signing/release.pfx'
            $arguments.PfxPassword = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          }
          ./scripts/package.ps1 @arguments

      - name: Create checksums
        run: |
          Get-ChildItem out -File | Where-Object Extension -In '.zip', '.msi', '.msix' |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ListopadPP-${{ steps.release.outputs.version }}-windows-x64
          if-no-files-found: error
          path: |
            out/*.zip
            out/*.msi
            out/*.msix
            out/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease || 'false' }}
        run: |
          $files = @(Get-ChildItem out -File | Where-Object Extension -In '.zip', '.msi', '.msix')
          $files += Get-Item out/SHA256SUMS.txt
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG @($files.FullName) --clobber
          } else {
            $arguments = @('release', 'create', $env:RELEASE_TAG) + $files.FullName + @(
              '--title', "Listopad++ $env:VERSION", '--generate-notes')
            if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
            gh @arguments
          }
